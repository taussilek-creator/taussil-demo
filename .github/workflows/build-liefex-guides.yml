name: Build LiefeX RTL Guides

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-dejavu-core curl
          sudo mkdir -p /usr/local/share/fonts
          sudo curl -L "https://github.com/google/fonts/raw/main/ofl/almarai/Almarai-Regular.ttf" -o /usr/local/share/fonts/Almarai-Regular.ttf
          sudo curl -L "https://github.com/google/fonts/raw/main/ofl/almarai/Almarai-Bold.ttf" -o /usr/local/share/fonts/Almarai-Bold.ttf
          sudo fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx pillow lxml arabic-reshaper python-bidi

      - name: Build DOCX guides
        run: |
          python liefex_training_guides/build_docs.py

      - name: Convert DOCX to PDF
        run: |
          mkdir -p liefex_training_guides/output/pdf
          libreoffice --headless --convert-to pdf --outdir liefex_training_guides/output/pdf liefex_training_guides/output/*.docx

      - name: Package output
        run: |
          cp liefex_training_guides/output/pdf/*.pdf liefex_training_guides/output/
          cd liefex_training_guides/output
          zip -r LiefeX_Professional_RTL_Training_Guides.zip *.docx *.pdf assets

      - name: Upload guides
        uses: actions/upload-artifact@v4
        with:
          name: liefex-professional-rtl-guides
          path: |
            liefex_training_guides/output/*.docx
            liefex_training_guides/output/*.pdf
            liefex_training_guides/output/*.zip
            liefex_training_guides/output/assets/*.png
          retention-days: 7
